<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구글 시트 연동 플래시카드</title>
    <style>
        :root { --primary-color: #0f9d58; --background-color: #f5f7fb; --card-front-bg: #ffffff; --card-back-bg: #0f9d58; --text-front: #333333; --text-back: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--background-color); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .container { text-align: center; width: 100%; max-width: 500px; padding: 20px; }
        h1 { color: #333; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .flashcard-container { perspective: 1000px; width: 100%; height: 300px; cursor: pointer; margin-bottom: 25px; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 15px; }
        .flashcard.flip { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: bold; padding: 25px; box-sizing: border-box; border-radius: 15px; text-align: center; word-break: keep-all; }
        .card-front { background-color: var(--card-front-bg); color: var(--text-front); border: 2px solid #e1e8ed; }
        .card-back { background-color: var(--card-back-bg); color: var(--text-back); transform: rotateY(180deg); font-size: 1.2rem; font-weight: normal; }
        
        .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        button { background-color: var(--primary-color); color: white; border: none; padding: 12px 25px; font-size: 1rem; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-weight: bold; }
        button:hover { background-color: #0b8043; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; box-shadow: none; }
        .progress { font-size: 1.1rem; color: #666; font-weight: 500; }
        
        .status-msg { font-size: 0.9rem; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🟢 구글 시트 플래시카드</h1>
        
        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="card">
                <div class="card-face card-front" id="question">데이터를 불러오는 중입니다...</div>
                <div class="card-face card-back" id="answer">잠시만 기다려주세요.</div>
            </div>
        </div>

        <div class="controls">
            <button id="prevBtn" onclick="prevCard()" disabled>이전</button>
            <div class="progress" id="progress">0 / 0</div>
            <button id="nextBtn" onclick="nextCard()" disabled>다음</button>
        </div>
        <div class="status-msg">구글 시트에서 내용을 수정하고 페이지를 새로고침하면 실시간 반영됩니다.</div>
    </div>

    <script>
        // 🔗 제공해주신 구글 스프레드시트 주소를 연동했습니다.
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS4BgLP65QxrKYnE-2ytTXTmTP3191EH5-9OckIuluBMxDYB8d_uA1nTVQfgnQRsJb9Lc5Jmq3RQuds/pub?gid=0&single=true&output=csv';

        let flashcardsData = [];
        let currentIndex = 0;

        const cardElement = document.getElementById('card');
        const questionElement = document.getElementById('question');
        const answerElement = document.getElementById('answer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressElement = document.getElementById('progress');

        // 🌐 구글 시트에서 CSV 데이터를 실시간으로 가져오는 함수
        async function fetchGoogleSheet() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error('네트워크 응답 실패');
                
                const csvText = await response.text();
                parseCSV(csvText);
            } catch (error) {
                console.error('Error fetching sheet:', error);
                questionElement.textContent = "데이터 로드 실패";
                answerElement.innerHTML = "Live Server 환경에서 실행했는지<br>혹은 주소를 확인해주세요.";
            }
        }

        // ⚙️ CSV 데이터를 안전하게 분석하여 배열로 만드는 헬퍼 함수
        function parseCSV(text) {
            flashcardsData = [];
            
            // 윈도우 스타일의 개행문자(\r\n)와 맥 스타일(\n)을 통일하여 줄 단위로 나눕니다.
            const lines = text.replace(/\r/g, '').split('\n');
            if (lines.length < 2) return;

            // 첫 번째 줄(헤더)에서 인덱스를 추출합니다. 
            // 첫 셀에 숨은 문자(BOM)가 있을 수 있으므로 포함 여부(includes)로 체크합니다.
            const firstLine = lines[0].split(',');
            let qIndex = -1;
            let aIndex = -1;

            firstLine.forEach((header, index) => {
                const cleanHeader = header.trim();
                if (cleanHeader.includes('질문')) qIndex = index;
                if (cleanHeader.includes('정답')) aIndex = index;
            });

            // 만약 헤더를 못 찾았다면 안전하게 0번 열을 질문, 1번 열을 정답으로 지정합니다.
            if (qIndex === -1) qIndex = 0;
            if (aIndex === -1) aIndex = 1;

            // 데이터 행들을 돌며 처리합니다.
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue; // 빈 줄 패스

                // 단순 split(',') 대신 쉼표 파싱 정규식을 사용하여 온전하게 열을 분리합니다.
                const row = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                if (row.length > Math.max(qIndex, aIndex)) {
                    // 양 끝 따옴표 제거 및 줄바꿈 기호 처리
                    let question = row[qIndex].trim().replace(/^"|"$/g, '');
                    let answer = row[aIndex].trim().replace(/^"|"$/g, '');

                    // 스프레드시트 안에서 강제 줄바꿈 한 경우 처리
                    question = question.replace(/\\n/g, '<br>');
                    answer = answer.replace(/\\n/g, '<br>');

                    if (question || answer) {
                        flashcardsData.push({ question, answer });
                    }
                }
            }

            if (flashcardsData.length > 0) {
                currentIndex = 0;
                updateCard();
            } else {
                questionElement.textContent = "가져올 데이터가 없습니다.";
            }
        }

        function updateCard() {
            cardElement.classList.remove('flip');
            
            setTimeout(() => {
                if (flashcardsData.length === 0) return;
                
                const currentCard = flashcardsData[currentIndex];
                questionElement.innerHTML = currentCard.question;
                answerElement.innerHTML = currentCard.answer;
                
                progressElement.textContent = `${currentIndex + 1} / ${flashcardsData.length}`;
                prevBtn.disabled = currentIndex === 0;
                nextBtn.disabled = currentIndex === flashcardsData.length - 1;
            }, 150);
        }

        function flipCard() { if(flashcardsData.length > 0) cardElement.classList.toggle('flip'); }
        function nextCard() { if (currentIndex < flashcardsData.length - 1) { currentIndex++; updateCard(); } }
        function prevCard() { if (currentIndex > 0) { currentIndex--; updateCard(); } }

        window.addEventListener('DOMContentLoaded', fetchGoogleSheet);
    </script>
</body>
</html>
